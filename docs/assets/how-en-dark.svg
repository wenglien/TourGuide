<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="How TourGuide works" font-family="'TGO','TGN','Overpass','Noto Sans TC','PingFang TC','Microsoft JhengHei','Helvetica Neue',Arial,sans-serif">
<title>How TourGuide works</title>
<defs><style>@font-face{font-family:'TGO';font-weight:100 900;src:url(data:font/woff;base64,) format('woff');}</style></defs>
<defs>
<linearGradient id="h0" gradientUnits="userSpaceOnUse" x1="150" x2="450" y1="0" y2="0"><stop offset="0" stop-color="#3CC7B8"/><stop offset="1" stop-color="#F0B429"/></linearGradient>
<linearGradient id="h1" gradientUnits="userSpaceOnUse" x1="450" x2="750" y1="0" y2="0"><stop offset="0" stop-color="#F0B429"/><stop offset="1" stop-color="#F07A9A"/></linearGradient>
<linearGradient id="h2" gradientUnits="userSpaceOnUse" x1="750" x2="1050" y1="0" y2="0"><stop offset="0" stop-color="#F07A9A"/><stop offset="1" stop-color="#8C97FF"/></linearGradient>
</defs>
<line x1="150" y1="60" x2="450" y2="60" stroke="url(#h0)" stroke-width="8" stroke-linecap="round"/>
<line x1="450" y1="60" x2="750" y2="60" stroke="url(#h1)" stroke-width="8" stroke-linecap="round"/>
<line x1="750" y1="60" x2="1050" y2="60" stroke="url(#h2)" stroke-width="8" stroke-linecap="round"/>
<circle cx="150" cy="60" r="30" fill="#3CC7B8"/><text x="150" y="71" text-anchor="middle" font-size="30" font-weight="900" fill="#121628">1</text>
<text x="150" y="152" text-anchor="middle" font-size="24" font-weight="900" fill="#E7EAF3">Say where and how long</text>
<text x="150" y="188" text-anchor="middle" font-size="17" font-weight="600" fill="#A9B0C6">A place, then anything</text>
<text x="150" y="214" text-anchor="middle" font-size="17" font-weight="600" fill="#A9B0C6">from 2 hours to 7 days.</text>
<circle cx="450" cy="60" r="30" fill="#F0B429"/><text x="450" y="71" text-anchor="middle" font-size="30" font-weight="900" fill="#121628">2</text>
<text x="450" y="152" text-anchor="middle" font-size="24" font-weight="900" fill="#E7EAF3">Find real places</text>
<text x="450" y="188" text-anchor="middle" font-size="17" font-weight="600" fill="#A9B0C6">Candidates come</text>
<text x="450" y="214" text-anchor="middle" font-size="17" font-weight="600" fill="#A9B0C6">from Google Places.</text>
<circle cx="750" cy="60" r="30" fill="#F07A9A"/><text x="750" y="71" text-anchor="middle" font-size="30" font-weight="900" fill="#121628">3</text>
<text x="750" y="152" text-anchor="middle" font-size="24" font-weight="900" fill="#E7EAF3">Pick and order</text>
<text x="750" y="188" text-anchor="middle" font-size="17" font-weight="600" fill="#A9B0C6">An LLM chooses the stops</text>
<text x="750" y="214" text-anchor="middle" font-size="17" font-weight="600" fill="#A9B0C6">and arranges the day.</text>
<circle cx="1050" cy="60" r="30" fill="#8C97FF"/><text x="1050" y="71" text-anchor="middle" font-size="30" font-weight="900" fill="#121628">4</text>
<text x="1050" y="152" text-anchor="middle" font-size="24" font-weight="900" fill="#E7EAF3">Walk the line</text>
<text x="1050" y="188" text-anchor="middle" font-size="17" font-weight="600" fill="#A9B0C6">Drag the train, swap stops,</text>
<text x="1050" y="214" text-anchor="middle" font-size="17" font-weight="600" fill="#A9B0C6">navigate, collect stamps.</text>
</svg>
